<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Điều khiển · Tam Phái Trấn Ma</title>
<style>*{box-sizing:border-box}body{background:#101620;color:#f6e8c8;font:17px system-ui;margin:auto;max-width:640px;padding:6vh 24px}h1{font:42px Georgia}section{padding:24px;border:1px solid #564632;background:#192130;border-radius:12px;margin:18px 0}input,button,a{font:inherit;padding:10px;border-radius:5px;margin:4px}button,a{background:#ebc77d;color:#241d13;border:0;cursor:pointer}input{width:95%;background:#101722;color:white;border:1px solid #647080}output{color:#95dcc2}</style>
<h1>Tam Phái Trấn Ma</h1><output id="status">Đang tải…</output><section><label>Kênh TikTok LIVE<input id="room" placeholder="@tenkenh"></label><button data-act="live">Kết nối LIVE</button><button data-act="stop">Dừng phiên</button></section><section><button data-act="demo">Bắt đầu giả lập</button><button data-act="gift">Thử quà tiếp theo</button><p>Đổi chế độ sẽ bắt đầu trận mới.</p></section><a href="/obs" target="_blank">Mở đấu trường OBS ↗</a><p id="err"></p><script>
const stream=new EventSource('/events');stream.onmessage=e=>{const s=JSON.parse(e.data);document.querySelector('output').textContent=s.status+' · '+s.count+' người tham chiến';};
document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{const r=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.act,room:document.querySelector('input').value.trim().replace(/^@/,'')})});document.querySelector('#err').textContent=r.ok?'':await r.text();}catch{document.querySelector('#err').textContent='Không kết nối được server';}});
</script></html>
